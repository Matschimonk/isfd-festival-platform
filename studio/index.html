<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ISFD Editorial Studio Lite</title>
    <link rel="stylesheet" href="./studio.css" />
  </head>
  <body>
    <main>
      <header>
        <p>ISFD BERLIN · LOCAL PREVIEW</p>
        <h1>Editorial Studio</h1>
        <p>
          Edit a working copy and export JSON for review. Closing this tab
          clears the workspace.
        </p>
      </header>
      <div class="toolbar">
        <label
          >Import JSON
          <input id="import" type="file" accept=".json,application/json"
        /></label>
        <button id="export" type="button">Export JSON</button>
        <label
          >Working records
          <select id="records">
            <option value="">New record</option>
          </select></label
        >
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <div class="layout">
        <form id="editor">
          <label
            >Collection
            <select name="type">
              <option>films</option>
              <option>events</option>
              <option>people</option>
              <option>partners</option>
              <option>media</option>
            </select></label
          >
          <label
            >Stable ID
            <input
              name="id"
              required
              pattern="[a-z0-9]+(-[a-z0-9]+)*"
              placeholder="stable-slug"
          /></label>
          <label
            >Edition
            <input
              name="edition"
              type="number"
              min="2026"
              max="2100"
              value="2027"
              required
          /></label>
          <label
            >Status
            <select name="status">
              <option>draft</option>
              <option>published</option>
            </select></label
          >
          <label
            >Source URL <input name="source" type="url" placeholder="https://…"
          /></label>
          <fieldset id="media-fields" hidden>
            <legend>Media</legend>
            <label
              >Rights
              <select name="rights">
                <option>pending</option>
                <option>approved</option>
              </select></label
            >
            <label>Media URL <input name="url" type="url" /></label>
            <label>Credit and rights holder <input name="credit" /></label>
          </fieldset>
          <div id="languages"></div>
          <button type="submit">Save working record</button>
        </form>
        <section aria-labelledby="preview-title">
          <h2 id="preview-title">Record preview</h2>
          <label
            >Language
            <select id="preview-language">
              <option value="en">English</option>
              <option value="it">Italiano</option>
              <option value="de">Deutsch</option>
            </select></label
          >
          <article class="preview">
            <p id="preview-label"></p>
            <h3 id="preview-name"></h3>
            <p id="preview-text"></p>
          </article>
        </section>
      </div>
    </main>
    <script type="module" src="./studio.js"></script>
  </body>
</html>
