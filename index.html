<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const theme = localStorage.getItem("isfd-theme");
        if (theme === "night" || theme === "day")
          document.documentElement.dataset.festivalTheme = theme;
      } catch {}
    </script>
    <link rel="icon" type="image/webp" href="/images/hero.webp" />
    <!-- page-head:start -->
    <title>Italy Short Film Days Berlin 2027</title>
    <meta name="robots" content="noindex" />
    <!-- page-head:end -->
    <noscript>
      <style>
        .header-inner #site-links {
          display: grid;
        }
        .festival-header .header-inner .menu-toggle,
        .festival-header .v3-theme,
        .page-body .timetable-interactive,
        .page-body .filters,
        .page-body .editorial-filters,
        .page-body .v3-news-form,
        .page-body .v3-play,
        #ticket-demo button {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
